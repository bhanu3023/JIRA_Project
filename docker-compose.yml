services:
  app:
    build: .
    container_name: jira_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:5882:8080"
    env_file:
      - .env.local
    depends_on:
      - postgres
    volumes:
      - jira_app_uploads:/app/public/uploads
      - jira_app_uploads_tmp:/app/uploads

  postgres:
    image: postgres:16-alpine
    container_name: jira_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jirauser
      POSTGRES_PASSWORD: "Neutara@2024"
      POSTGRES_DB: jiradb
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - jira_postgres_data:/var/lib/postgresql/data

  # --- AI DevOps Incident Agent: monitoring layer (Phase 3) ---
  # Ports are bound to 127.0.0.1 only, matching app/postgres above -- not
  # reachable from outside this server. All three talk to each other by
  # Docker Compose's built-in service-name DNS on the same project network
  # app/postgres already share.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "127.0.0.1:9100:9100"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - node-exporter

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"

volumes:
  jira_postgres_data:
  jira_app_uploads:
  jira_app_uploads_tmp:
  prometheus_data:
